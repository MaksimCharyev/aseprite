plugins {
    id 'com.android.application'
}

// Native variant (ADR 0008 section 3): -PnativeTarget=probe|hello_laf|aseprite.
// The default is `aseprite` (the app itself, M1.8).
def nativeTarget = (project.findProperty('nativeTarget') ?: 'aseprite').toString()
if (!['probe', 'hello_laf', 'aseprite'].contains(nativeTarget)) {
    throw new GradleException("Unknown -PnativeTarget=${nativeTarget} (probe, hello_laf or aseprite)")
}
def repoDir = rootProject.projectDir.parentFile
def skiaDir = (project.findProperty('skiaDir') ?: System.getenv('SKIA_DIR') ?:
               "${System.getProperty('user.home')}/deps/skia-m124-android").toString()
def genExe = "${repoDir}/build/host-tools/bin/gen"

android {
    namespace = 'com.github.maksimcharyev.aseprite'
    compileSdk = 35
    ndkVersion = '26.1.10909125'      // NDK r26b

    defaultConfig {
        applicationId = 'com.github.maksimcharyev.aseprite'
        minSdk = 29
        targetSdk = 34
        versionCode = 2
        versionName = "0.0.3-m1-${nativeTarget}"

        // The Java-side key logging of the M0.6 input probe is only enabled
        // in the probe variant.
        buildConfigField 'boolean', 'INPUT_PROBE', nativeTarget == 'probe' ? 'true' : 'false'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          "-DASEPRITE_NATIVE_TARGET=${nativeTarget}",
                          "-DSKIA_DIR=${skiaDir}",
                          "-DGEN_EXE=${genExe}"
                // Build (and package) only the library of the variant, not
                // everything the root project defines.
                targets(nativeTarget == 'probe' ? 'aseprite' : nativeTarget)
            }
        }
    }

    buildTypes {
        // Debug signing only (the default ~/.android/debug.keystore); there
        // is no release configuration on purpose (EULA: personal builds).
        debug {
            debuggable = true
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.31.6'
        }
    }

    buildFeatures {
        prefab = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Same as AGP's default (aapt2 ignoreAssetsPattern), spelled out because
    // the GenerateDataAssets task below must apply exactly the same filter:
    // data.manifest lists what is really packaged.
    androidResources {
        ignoreAssetsPattern = AssetsFilter.AAPT_PATTERN
    }
}

// Aseprite's data/ (plus the files the desktop `copy_data` target adds,
// src/CMakeLists.txt) is packaged as assets/data/ together with
// assets/data.manifest (ADR 0002, ADR 0008 section 4). Generated, never
// copied by hand.
androidComponents {
    onVariants(selector().all()) { variant ->
        def genAssets = tasks.register("generate${variant.name.capitalize()}DataAssets",
                                       GenerateDataAssets) {
            dataDir.set(file("${repoDir}/data"))
            extraFiles.from(
                ["README.md": "${repoDir}/README.md",
                 "AUTHORS.md": "${repoDir}/AUTHORS.md",
                 "EULA.txt": "${repoDir}/EULA.txt",
                 "docs/LICENSES.md": "${repoDir}/docs/LICENSES.md"].values())
            extraNames.set(["README.md", "AUTHORS.md", "EULA.txt", "docs/LICENSES.md"])
        }
        variant.sources.assets.addGeneratedSourceDirectory(genAssets, GenerateDataAssets::getOutputDir)
    }
}

// aapt2 --ignore-assets pattern (AGP default): "!" entries apply to files and
// dirs, entries without it only to the given kind (<dir> = directories).
class AssetsFilter {
    static final String AAPT_PATTERN =
        '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'

    static boolean ignored(String name, boolean isDir) {
        if (name.startsWith('.') || name.endsWith('~')) return true
        if (isDir && name.startsWith('_')) return true
        return ['cvs', 'thumbs.db', 'picasa.ini', '.ds_store'].contains(name.toLowerCase()) ||
               name.toLowerCase().endsWith('.scc')
    }
}

abstract class GenerateDataAssets extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getDataDir()

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getExtraFiles()

    // Destination (relative to assets/data/) of each extra file, in the same
    // order as extraFiles.
    @Input
    abstract ListProperty<String> getExtraNames()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def out = outputDir.get().asFile
        project.delete(out)
        def dataOut = new File(out, 'data')
        dataOut.mkdirs()

        // relative path -> source file
        def files = new TreeMap<String, File>()
        def root = dataDir.get().asFile
        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def rel = root.toPath().relativize(f.toPath())
            boolean skip = false
            rel.eachWithIndex { part, i ->
                if (AssetsFilter.ignored(part.toString(), i < rel.nameCount - 1))
                    skip = true
            }
            if (!skip) files.put(rel.toString().replace('\\', '/'), f)
        }
        def extras = extraFiles.files.toList()
        extraNames.get().eachWithIndex { name, i -> files.put(name, extras[i]) }

        def md = java.security.MessageDigest.getInstance('SHA-256')
        files.each { rel, src ->
            def dst = new File(dataOut, rel)
            dst.parentFile.mkdirs()
            java.nio.file.Files.copy(src.toPath(), dst.toPath())
            md.update("${rel}\u0000${src.length()}\u0000".getBytes('UTF-8'))
            md.update(src.bytes)
        }
        def hash = md.digest().collect { String.format('%02x', it) }.join()
        // Line 1: "sha256 <hash>"; then one relative path per line (file
        // count = number of lines - 1).
        new File(out, 'data.manifest').text =
            "sha256 ${hash}\n" + files.keySet().join('\n') + '\n'
    }
}

dependencies {
    // Aligns kotlin-stdlib / -jdk7 / -jdk8 (AndroidX pulls both old and new
    // ones and checkDebugDuplicateClasses fails without it). No Kotlin code.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.games:games-activity:4.4.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}

// The generated sources of Aseprite are produced by `gen`, which runs on the
// build machine: build it for the host first (ADR 0008 section 1). Only the
// aseprite variant needs it (probe and hello_laf don't generate anything).
tasks.register('buildHostGen', Exec) {
    commandLine "${repoDir}/android/scripts/build-host-gen.sh"
}
if (nativeTarget == 'aseprite') {
    tasks.named('preBuild') { dependsOn 'buildHostGen' }
    tasks.matching { it.name.startsWith('configureCMake') }.configureEach {
        dependsOn 'buildHostGen'
    }
}
